<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/png" href="../../Images/Logo_Alkyon_png.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie - Alkyon</title>
    <link rel="stylesheet" href="messaging.css">
</head>
<body>
    <div class="messaging-container">
        <!-- Sidebar avec liste des amis -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Alkyon</h2>
                <div class="sidebar-actions">
                    <button id="addFriendBtn" class="btn-icon" title="Ajouter un ami">➕</button>
                    <button id="logoutBtn" class="btn-icon" title="Déconnexion">🚪</button>
                </div>
            </div>

            <!-- Demandes d'amitié -->
            <div id="requestsContainer" style="display: none; margin-bottom: 15px;">
                <h3 style="font-size: 12px; color: #72767d; text-transform: uppercase; padding: 10px 5px;">Demandes</h3>
                <div id="friendRequests" class="friend-requests"></div>
            </div>

            <!-- Liste des amis -->
            <h3 style="font-size: 12px; color: #72767d; text-transform: uppercase; padding: 10px 5px; margin-top: 15px;">Amis en ligne</h3>
            <div id="friendsList" class="friends-list"></div>
        </aside>

        <!-- Zone de conversation -->
        <main class="chat-area">
            <div id="chatHeader" class="chat-header">
                <h3 id="friendName">Sélectionnez un ami</h3>
                <span id="friendStatus" class="friend-status"></span>
            </div>

            <div id="messagesContainer" class="messages-container"></div>

            <!-- Zone de saisie -->
            <div class="message-input-area" id="inputArea" style="display: none;">
                <form id="messageForm" onsubmit="sendMessage(event)">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Tapez un message..." 
                        required>
                    <button type="submit" class="btn-send">Envoyer</button>
                </form>
            </div>
        </main>
    </div>

    <!-- Modal ajouter un ami -->
    <div id="addFriendModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Ajouter un ami</h2>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Rechercher un utilisateur..." autocomplete="off">
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0"></script>
    <script src="../../authentification/auth.js"></script>
    <script src="messageService.js"></script>
    <script src="messaging.js"></script>
</body>
</html>

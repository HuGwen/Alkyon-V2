<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/png" href="Logo_Alkyon_png.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification - Alkyon</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <img src="Logo_Alkyon_Backround.png" alt="Logo" height="40">
            <li><a href="../Alkyon.html">Accueil</a></li>
            <li><a href="../Fonctionnalité.html">Fonctionnalités</a></li>
                <hr style="margin-top: 5px; margin-bottom: 5px;">
            <li><a href="#">Authentification</a></li>
        </ul>
    </nav>
    <div class="container">
        <div id="loginForm" class="form-container active">
            <h1>Connexion</h1>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email:</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Mot de passe:</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn">Connexion</button>
            </form>
            <p>Pas encore inscrit? <a href="#" onclick="toggleForms()">S'inscrire</a></p>
        </div>

        <div id="registerForm" class="form-container">
            <h1>Inscription</h1>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="registerName">Nom:</label>
                    <input type="text" id="registerName" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email:</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Mot de passe:</label>
                    <input type="password" id="registerPassword" required>
                </div>
                <button type="submit" class="btn">S'inscrire</button>
            </form>
            <p>Déjà inscrit? <a href="#" onclick="toggleForms()">Se connecter</a></p>
        </div>

        <div id="dashboard" class="form-container">
            <h1>Bienvenue <span id="userName"></span>!</h1>
            <p>Vous êtes connecté avec succès, redirection.</p>
            <p>Vous avez pas été redirigé ?</p><li><a href="../Alkyon/Home.html">Appuiez ici</a></li>
            <div class="user-info">
                <p><strong>Email:</strong> <span id="userEmail"></span></p>
            </div>
            <button onclick="handleLogout()" class="btn btn-logout">Déconnexion</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script src="auth.js"></script>
</body>
</html>

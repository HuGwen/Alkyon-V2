<!doctype html>
<html lang="fr">
<head>
    <link rel="icon" type="image/png" href="Logo_Alkyon_png.png">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Inscription - Alkyon</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <img src="Logo_Alkyon_Backround.png" alt="Logo" height="40">
            <li><a href="../../Alkyon.html">Accueil</a></li>
            <li><a href="#">Fonctionnalités</a></li>
                    <hr style="margin-top: 5px; margin-bottom: 5px;">
            <li><a href="../login/login.html">Se connecter</a></li>
            <li><a href="register.html">S'inscire</a></li>
        </ul>
    </nav>
    <!--Fin de la ligne de code principale utilisé sur tout les sites web HTML-->

        <div class="register-container">
        <h1>Inscription</h1>
        <p class="subtitle">Créez votre compte</p>

        <form method="post" action="/register">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" name="username" id="username" placeholder="Entrez votre nom d'utilisateur">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="votre@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" name="password" id="password" placeholder="Entrez votre mot de passe" required>
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" name="remember" id="remember">
                    <span>Se souvenir de moi</span>
                </label>
            </div>

            <button class="login-btn" type="submit">S'inscrire</button>
        </form>

        <div class="signup-link">
            Vous avez déja un compte ? <a href="../login/login.html">Se connecter</a>
        </div>
    </div>
</body>
</html>
